<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-WAYS SHUTTLE PALLET DASHBOARD</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div id="app-container">
        <header id="app-header">
            <!-- Đổi tên Dashboard -->
            <h1>4-WAYS SHUTTLE PALLET DASHBOARD</h1>
            <div class="header-controls">
                 <button id="btn-settings" class="btn-mode">Cài đặt</button>
                <div id="mode-switcher">
                    <!-- Chỉ giữ lại chế độ 3D -->
                    <button class="btn-mode active" id="btn-mode-3d">3D</button>
                </div>
            </div>
        </header>

        <main id="viewport">
            <div id="floating-panel">
                <div class="panel-header">
                    <h3>Bảng điều khiển</h3>
                    <button id="btn-close-panel">✕</button>
                </div>
                <div class="panel-content">
                    <!-- Chỉ giữ lại Cấu hình Kho -->
                    <div class="panel-section" id="config-section">
                        <h2 class="collapsible">Cấu hình Kho</h2>
                        <div class="collapsible-content">
                            <div class="form-group">
                                <label>Kích thước (D-R-C):</label>
                                <div class="input-group">
                                    <input type="number" id="inpL" placeholder="X">
                                    <input type="number" id="inpW" placeholder="Y">
                                    <input type="number" id="inpH" placeholder="Z">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Đã xóa các section: Anchor, Vật thể, Tags Real-time, Tag History -->
                </div>
                <!-- Đặt đoạn này ngay bên dưới section Cấu hình Kho -->
                    <div class="panel-section" id="racks-section">
                        <h2 class="collapsible">Quản lý Kệ hàng (Racks)</h2>
                        <div class="collapsible-content">
                            <div class="form-group">
                                <label>Thông số kệ mới (Dài - Rộng - Cao - Số tầng):</label>
                                <div class="input-group">
                                    <input type="number" id="rackL" placeholder="Dài" value="2">
                                    <input type="number" id="rackW" placeholder="Rộng" value="1">
                                    <input type="number" id="rackH" placeholder="Cao" value="3">
                                    <input type="number" id="rackTiers" placeholder="Tầng" value="4">
                                </div>
                                <button id="btn-add-rack" class="btn-secondary" style="margin-top: 5px;">+ Thêm Kệ</button>
                            </div>
                            <div id="rack-list" style="margin-top: 15px; max-height: 150px; overflow-y: auto;">
                                <!-- Danh sách kệ sẽ hiển thị ở đây -->
                            </div>
                        </div>
                    </div>
            </div>

            <div id="scene-container"></div>
            <!-- Đã xóa map-2d-container -->
            <div id="axis-container"></div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="client.js"></script>
</body>
</html>
