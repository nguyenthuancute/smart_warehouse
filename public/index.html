<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-WAYS SHUTTLE PALLET DASHBOARD</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div id="app-container">
        <header id="app-header">
            <h1>4-WAYS SHUTTLE PALLET DASHBOARD</h1>
            <div class="header-controls">
                <button id="btn-settings" class="btn-mode">Cài đặt</button>
                <div id="mode-switcher"><button class="btn-mode active" id="btn-mode-3d">3D</button></div>
            </div>
        </header>
        <main id="viewport">
            <div id="floating-panel">
                <div class="panel-header"><h3>Bảng điều khiển</h3><button id="btn-close-panel">✕</button></div>
                <div class="panel-content">
                    <div class="panel-section" id="config-section">
                        <h2 class="collapsible active">Cấu hình Kho (m)</h2>
                        <div class="collapsible-content" style="max-height:none">
                            <div class="form-group">
                                <label>Dài - Rộng (theo layout) - Cao:</label>
                                <div class="input-group">
                                    <input type="number" id="inpL" placeholder="X" readonly>
                                    <input type="number" id="inpW" placeholder="Z" readonly>
                                    <input type="number" id="inpH" placeholder="Y" value="8" min="3" max="30">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="panel-section" id="racks-section">
                        <h2 class="collapsible active">Quản lý Kệ hàng</h2>
                        <div class="collapsible-content" style="max-height:none">
                            <div class="form-group">
                                <label>Số cột - Số hàng - Số tầng - Cao/tầng (m):</label>
                                <div class="input-group">
                                    <input type="number" id="rackC" value="4" min="1" max="12">
                                    <input type="number" id="rackR" value="10" min="1" max="30">
                                    <input type="number" id="rackT" value="4" min="1" max="10">
                                    <input type="number" id="rackTH" value="1.5" step="0.1" min="0.5" max="3">
                                </div>
                            </div>
                            <button id="btn-add-rack" class="btn-secondary">+ Thêm Kệ</button>
                            <button id="btn-load-layout" class="btn-secondary" style="margin-top:6px">↺ Nạp lại layout kho</button>
                            <label style="display:block;margin:10px 0 6px;font-size:.85em"><input type="checkbox" id="chk-drag"> Cho phép kéo kệ</label>
                            <div class="upload-section" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ccc; margin-bottom: 15px;">
    <label style="font-weight: bold; margin-bottom: 5px; display: block;">Khởi tạo Kệ bằng AI (Bản vẽ 2D)</label>
    <input type="file" id="layoutUpload" accept="image/*" style="width: 100%; margin-bottom: 10px;" />
    <button id="btnAiGenerate" style="width: 100%; padding: 8px; background-color: #6366f1; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Phân tích AI
    </button>
    <div id="aiStatus" style="font-size: 0.85rem; color: #555; margin-top: 8px;"></div>
</div>
                            <div id="rack-summary" style="font-size:.8em;color:var(--secondary);margin-bottom:6px"></div>
                            <div id="rack-list"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="scene-container"></div>
            <div id="axis-container"></div>
        </main>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="client.js?v=2"></script>
</body>
</html>
